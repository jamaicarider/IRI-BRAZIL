<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obrigado</title>
  </head>
  <body>
    <script>
      const targetOrigin = 'https://movimentosoma.com';

      if (window.parent !== window) {
        window.parent.postMessage('soma-form-enviado', targetOrigin);
      } else {
        sessionStorage.setItem('soma-form-enviado', 'true');
        window.location.replace('/?form=enviado');
      }
    </script>
  </body>
</html>
